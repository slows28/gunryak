name: Godot 4.7.2 regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

# Keep the newest revision only; push and PR builds for the same head share a group.
concurrency:
  group: godot-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  headless:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned Godot 4.7.2 editor
        shell: bash
        run: |
          set -euo pipefail
          GODOT_URL="https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip"
          curl --fail --location --retry 3 "$GODOT_URL" -o /tmp/godot.zip
          # Godot release archive checksum has not yet been independently verified.
          # Do not pin an invented SHA256. Verify the official checksum before release use.
          unzip -q /tmp/godot.zip -d /tmp/godot_bin
          chmod +x /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64
          /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64 --version
      - name: Run real Godot tests
        run: |
          python3 tools_run_engine_tests.py --godot /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64 --project .
      - name: Capture actual game frames with virtual display
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          # Ensure the Linux virtual display has real Hangul glyphs.
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-nanum
          fc-cache -f
          fc-match "NanumGothic" -f '%{family}\n'
          mkdir -p test_results/screenshots
          xvfb-run -a -s "-screen 0 1280x800x24" \
            env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64 \
            --rendering-driver opengl3 --path . \
            --script res://tests/screenshot.gd 2>&1 | tee test_results/visual_capture.log
          if grep -E "SCRIPT ERROR|Parse Error|VISUAL_CAPTURE_FAIL" test_results/visual_capture.log; then exit 1; fi
          xvfb-run -a -s "-screen 0 1280x800x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            /tmp/godot_bin/Godot_v4.7.2-stable_linux.x86_64 --rendering-driver opengl3 --audio-driver Dummy --path . \
            --script res://tests/northern_screen.gd 2>&1 | tee test_results/northern_screen.log
          grep -qx NORTHERN_SCREEN_PASS test_results/northern_screen.log
          if grep -E "SCRIPT ERROR|^ERROR:" test_results/northern_screen.log; then exit 1; fi
          python3 - <<'PY'
          import pathlib, struct
          folder = pathlib.Path("test_results/screenshots")
          for name in ("title.png", "campaign_map.png", "before_battle.png", "battle_48s.png", "battle_112s.png", "battle_240s.png", "battle_result.png"):
              file = folder/name
              if not file.exists():
                  raise SystemExit(f"Screenshot missing: {file}")
              data = file.read_bytes()
              if data[:8] != bytes([137, 80, 78, 71, 13, 10, 26, 10]):
                  raise SystemExit(f"Invalid PNG signature: {name}")
              width, height = struct.unpack(">II", data[16:24])
              if width < 1000 or height < 700 or len(data) < 5000:
                  raise SystemExit(f"Blank/small screenshot: {name} {width}x{height}, {len(data)} bytes")
              print(f"SCREENSHOT_PASS {name}: {width}x{height}, {len(data)} bytes")
          PY
      - name: Upload actual game screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-game-screenshots
          path: test_results/screenshots/*.png
          if-no-files-found: warn
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-engine-logs
          path: test_results/
          if-no-files-found: warn

  windows-headless:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install official Godot 4.7.2 for Windows
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_win64.exe.zip'
          Invoke-WebRequest -Uri $url -OutFile "$env:RUNNER_TEMP\godot.zip" -MaximumRetryCount 4 -RetryIntervalSec 10
          Expand-Archive -Path "$env:RUNNER_TEMP\godot.zip" -DestinationPath "$env:RUNNER_TEMP\godot-bin" -Force
          & "$env:RUNNER_TEMP\godot-bin\Godot_v4.7.2-stable_win64_console.exe" --version
      - name: Run genuine Windows Godot tests
        shell: pwsh
        run: |
          python tools_run_engine_tests.py --godot "$env:RUNNER_TEMP\godot-bin\Godot_v4.7.2-stable_win64_console.exe" --project .
      - name: Preserve Windows test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: godot-windows-logs
          path: test_results/
          if-no-files-found: warn

  demo-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned editor and matching export templates
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/4.7.2-stable"
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/editor.zip
          curl --fail --location --retry 3 "$base/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/editor.zip -d /tmp/editor
          chmod +x /tmp/editor/Godot_v4.7.2-stable_linux.x86_64
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          cp /tmp/templates/templates/* "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Import project and export Windows and Linux candidates
        run: |
          set -euo pipefail
          engine=/tmp/editor/Godot_v4.7.2-stable_linux.x86_64
          "$engine" --headless --editor --import --path . --quit
          mkdir -p dist
          "$engine" --headless --path . --export-release "Windows Desktop" dist/Gunryak.exe
          "$engine" --headless --path . --export-release "Linux" dist/Gunryak.x86_64
          test -s dist/Gunryak.exe
          test -s dist/Gunryak.x86_64
          chmod +x dist/Gunryak.x86_64
          cp audio_source/FluidR3-COPYRIGHT.txt art_source/Basemap-LICENSE.txt dist/
          dist/Gunryak.x86_64 --headless --quit-after 10 2>&1 | tee /tmp/gunryak-export-startup.log
          if grep -E "SCRIPT ERROR|Parse Error" /tmp/gunryak-export-startup.log; then exit 1; fi
          printf '%s\n' 'Gunryak public demo candidate 0.9 — not a final release.' 'Windows: run Gunryak.exe. Linux: run Gunryak.x86_64.' 'Korean UI; local campaign saves. Windows GUI is not verified by headless tests.' > dist/README.txt
          (cd dist && sha256sum Gunryak.exe Gunryak.x86_64 > SHA256SUMS.txt)
      - name: Upload portable demo candidate
        uses: actions/upload-artifact@v4
        with:
          name: gunryak-demo-candidate
          path: dist/
          if-no-files-found: error
