      <path d="M-4-4Q1-6 5-5L5 4-3 5-6 2Z" fill="#5a6060"/>
      <path d="M-2-4L-1 3M1-4L2 3" stroke="#aaa698" stroke-width="1.3"/>
      <path d="M7-5L6 5" stroke="#ad9267" stroke-width="2.5"/>
      <path d="M10-3L10 4" stroke="#403a31"/>
    </g>
    <g id="back">
