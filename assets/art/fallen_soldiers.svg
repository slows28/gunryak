        <path d="M15 17L11 17M30 32L33 33" stroke="#b08b69" stroke-width="3"/>
      </g>
      <use xlink:href="#coat" transform="translate(25 24)"/>
      <use xlink:href="#helm" transform="translate(15 23) rotate(-13)"/>
    </g>
    <g id="side">
